services:
  postgres:
    image: postgres:15
    container_name: lab2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab2_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  
    networks:
      - lab2net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: lab2_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: lab2_reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: mypassword123          
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"    
    volumes:
      - chdata:/var/lib/clickhouse  
    networks:
      - lab2net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s

  spark:
    image: apache/spark:3.5.1-python3
    container_name: lab2_spark
    user: root
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_healthy
    environment:
      - SPARK_MODE=client
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/opt/spark/data:ro
    entrypoint: ["/bin/bash", "-lc", "
      set -e;
      mkdir -p /opt/spark/jars;
      if [ ! -f /opt/spark/jars/postgresql-42.7.3.jar ]; then
        curl -L -o /opt/spark/jars/postgresql-42.7.3.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar;
      fi;
      if [ ! -f /opt/spark/jars/clickhouse-jdbc-0.5.0-http.jar ]; then
        curl -L -o /opt/spark/jars/clickhouse-jdbc-0.5.0-http.jar https://repo1.maven.org/maven2/com/clickhouse/clickhouse-jdbc/0.5.0/clickhouse-jdbc-0.5.0-http.jar;
      fi;
      python3 -m pip install --no-cache-dir 'clickhouse-connect==0.7.1' pandas;
      sed -i 's/\r$//' /opt/spark/work-dir/run_all.sh;
      /bin/bash /opt/spark/work-dir/run_all.sh
      "]
    networks:
      - lab2net

networks:
  lab2net:
    driver: bridge

volumes:
  pgdata:
  chdata: